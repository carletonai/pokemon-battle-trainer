[project]
name = "battle-trainer"
version = "0.1.0"
description = "AI Pokémon Battle Trainer: a self-play RL bot for Pokémon Showdown (CAIS RL project)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Simulator client: talks to a Pokémon Showdown server and exposes Gymnasium/PettingZoo envs.
  "poke-env>=0.16.1,<0.17",
  "gymnasium>=1.3",
  "numpy>=2.0",
  # Learning. Linux installs CPU-only wheels by default (see [tool.uv.sources] below).
  "torch>=2.5",
]

[project.optional-dependencies]
# libpkmn (fast Gen 1 engine) via the oak Python package. Linux wheels only.
engine = ["oak-lab>=1.1 ; sys_platform == 'linux'"]

[dependency-groups]
dev = [
  "pytest>=9",
  "ruff>=0.17",
  "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battle_trainer"]

# ---------------------------------------------------------------------------
# uv: CPU-only PyTorch on Linux by default. It is a tenth of the size of the CUDA
# build, works on every laptop and in CI, and training here is bound by simulator
# throughput, not GPUs. For a CUDA install see README.md ("GPU").
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "RUF", # ruff-specific
]
ignore = [
  "RUF001", "RUF002", "RUF003",  # allow non-ASCII (é in Pokémon) in strings and comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "showdown: needs a local Pokémon Showdown server on localhost:8000 (scripts/start_showdown.sh)",
]
