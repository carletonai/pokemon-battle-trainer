[project]
name = "battle-trainer"
version = "0.1.0"
description = "AI Pokémon Battle Trainer: a self-play RL bot for Pokémon Showdown (CAIS RL project)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  # Simulator client: talks to a Pokémon Showdown server and exposes Gymnasium/PettingZoo envs.
  "poke-env>=0.16.1,<0.17",
  "gymnasium>=1.3",  # poke-env 0.16.1 pins gymnasium==1.3.0 and websockets==16.1.1; bump with poke-env
  "numpy>=2.0",
  # Learning. PPO comes from Stable-Baselines3; MaskablePPO lives in sb3-contrib.
  # See the note on PyTorch wheel size under [tool.uv] below.
  "torch>=2.8",
  "stable-baselines3>=2.9.2,<3",
  "sb3-contrib>=2.9.2,<3",
]

[project.optional-dependencies]
# libpkmn (fast Gen 1 engine) via the oak Python package. Linux wheels only.
engine = ["oak-lab>=1.1 ; sys_platform == 'linux'"]

[dependency-groups]
dev = [
  "pytest>=9",
  "ruff>=0.17.3,<0.18",  # keep in step with rev in .pre-commit-config.yaml
  "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battle_trainer"]

# ---------------------------------------------------------------------------
# PyTorch comes from PyPI so that uv.lock can be produced anywhere. On Linux that wheel
# bundles CUDA (about 3 GB with its nvidia-* dependencies); macOS and Windows get the
# small CPU build. For CPU-only wheels on Linux, add this, then `uv lock` and commit:
#
#   [[tool.uv.index]]
#   name = "pytorch-cpu"
#   url = "https://download.pytorch.org/whl/cpu"
#   explicit = true
#
#   [tool.uv.sources]
#   torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "RUF", # ruff-specific
]
ignore = [
  "RUF001", "RUF002", "RUF003",  # allow non-ASCII (é in Pokémon) in strings and comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "showdown: needs a local Pokémon Showdown server on localhost:8000 (scripts/start_showdown.sh)",
]
