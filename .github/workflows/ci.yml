name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest

  showdown-smoke:
    name: Showdown smoke battle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Cache npm downloads for Showdown
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: showdown-npm-${{ runner.os }}-${{ hashFiles('third_party/SHOWDOWN_COMMIT') }}
      - name: Build Showdown at the pinned commit
        run: scripts/setup_showdown.sh
      - name: Install
        run: uv sync
      - name: Start a local server
        shell: bash
        run: |
          scripts/start_showdown.sh > showdown.log 2>&1 &
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/localhost/8000) 2>/dev/null; then
              echo "server is up"; exit 0
            fi
            sleep 1
          done
          echo "server did not start"; cat showdown.log; exit 1
      - name: Battle the built-in bots
        run: uv run python scripts/smoke_battle.py --battles 5
      - name: Server-backed tests
        run: uv run pytest -m showdown
        env:
          SHOWDOWN_REQUIRED: "1"
      - name: Server log
        if: failure()
        run: cat showdown.log || true
